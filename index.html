<!DOCTYPE html>
<html lang="en" data-theme="engineering">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self';"
  />
  <title>Wilson Lee</title>
  <meta name="description" content="Wilson Lee portfolio: engineering projects and photography." />
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg?v=9" />
  <link rel="preload" as="image" href="assets/images/profile/wilson-lee.jpg" />
  <link rel="stylesheet" href="styles.css?v=9" />
</head>
<body>
  <!-- Fullscreen Welcome / Loading Intro Screen -->
  <section class="intro-screen" id="introScreen" aria-label="Welcome screen">
    <div class="intro-content">
      <svg class="intro-name-svg" viewBox="0 0 620 180" fill="none">
        <!-- "wilson" hand-drawn cursive stroke -->
        <path
          class="intro-stroke-name"
          pathLength="1"
          d="M 50 86 C 60 115, 70 130, 82 130 C 94 130, 102 105, 110 86 C 118 115, 128 130, 140 130 C 150 130, 158 105, 166 86 C 168 102, 172 118, 176 130 C 180 132, 186 126, 192 116 C 200 95, 215 50, 222 32 C 225 24, 218 24, 212 36 C 204 55, 206 100, 216 130 C 224 130, 235 110, 244 86 C 248 80, 238 88, 236 98 C 234 116, 256 120, 252 130 C 250 134, 242 132, 240 128 C 246 124, 260 115, 272 90 C 280 82, 292 84, 294 98 C 296 114, 280 130, 268 126 C 260 120, 264 96, 276 86 C 284 80, 298 84, 306 88 C 308 98, 312 118, 314 130 C 316 115, 324 86, 338 86 C 350 86, 356 106, 358 130 C 362 134, 370 130, 380 122"
        />
        <circle class="intro-dot" cx="174" cy="58" r="4.5" fill="#ffffff" />
        <!-- "lee" hand-drawn cursive stroke -->
        <path
          class="intro-stroke-name intro-stroke-delay"
          pathLength="1"
          d="M 420 122 C 432 105, 452 50, 460 32 C 464 24, 456 24, 450 36 C 442 55, 444 100, 454 130 C 462 130, 474 108, 482 86 C 488 80, 478 82, 472 94 C 464 112, 474 130, 488 130 C 500 126, 510 108, 518 86 C 524 80, 514 82, 508 94 C 500 112, 510 130, 524 130 C 536 130, 554 122, 570 112"
        />
      </svg>

      <div class="intro-scroll-hint" id="introScrollHint">
        <svg class="intro-arrow-svg" viewBox="0 0 48 84" fill="none">
          <path
            class="hand-stroke-main"
            pathLength="1"
            d="M 25 6 C 22 24, 26 44, 24 68"
          />
          <path
            class="hand-stroke-tip"
            pathLength="1"
            d="M 11 54 C 16 61, 21 67, 24 73 C 28 66, 33 59, 38 53"
          />
        </svg>
        <span class="intro-scroll-label">scroll</span>
      </div>
    </div>
  </section>

  <header class="top-bar">
    <nav class="pill-switch" role="tablist" aria-label="Portfolio sections" data-active="engineering">
      <div class="pill-indicator" id="pillIndicator"></div>
      <button
        type="button"
        role="tab"
        id="tab-engineering"
        class="pill-option is-active"
        aria-selected="true"
        aria-controls="stage-content"
        data-section="engineering"
      >
        Engineering
      </button>
      <button
        type="button"
        role="tab"
        id="tab-photography"
        class="pill-option"
        aria-selected="false"
        aria-controls="stage-content"
        data-section="photography"
      >
        Photography
      </button>
    </nav>

    <div class="profile-Slot">
      <div class="hand-hint profile-hint is-hidden" id="profileHint">
        <svg class="hand-arrow-svg" viewBox="0 0 120 70" fill="none">
          <path
            class="hand-stroke-main"
            pathLength="1"
            d="M 8 54 C 32 58, 56 42, 52 24 C 49 11, 32 14, 35 28 C 38 43, 72 44, 102 28"
          />
          <path
            class="hand-stroke-tip"
            pathLength="1"
            d="M 90 22 C 96 25, 101 27, 105 27 C 100 32, 96 37, 93 42"
          />
        </svg>
      </div>

      <button
        type="button"
        class="profile-trigger"
        id="profileTrigger"
        aria-label="Open Wilson Lee profile window"
        aria-haspopup="dialog"
        aria-controls="profileDialog"
      >
        <img
          id="profileTriggerImg"
          src="assets/images/profile/wilson-lee.jpg"
          alt="Wilson Lee"
          width="56"
          height="56"
          class="profile-trigger-img"
        />
      </button>
    </div>
  </header>

  <main id="stage-content" class="floating-stage">
    <section class="card-cluster top-cluster" id="topCluster" aria-label="Top works"></section>
    <section class="floating-text-band" id="middleTexts" aria-label="Notes"></section>
    <section class="card-cluster bottom-cluster" id="bottomCluster" aria-label="Bottom works"></section>
  </main>

  <button
    type="button"
    class="scroll-brush-btn is-hidden"
    id="scrollHintBtn"
    aria-label="Scroll down"
    title="Scroll down"
  >
    <svg class="scroll-brush-svg" viewBox="0 0 48 84" fill="none">
      <path
        class="hand-stroke-main"
        pathLength="1"
        d="M 25 6 C 22 24, 26 44, 24 68"
      />
      <path
        class="hand-stroke-tip"
        pathLength="1"
        d="M 11 54 C 16 61, 21 67, 24 73 C 28 66, 33 59, 38 53"
      />
    </svg>
  </button>

  <dialog id="profileDialog" class="profile-dialog" closedby="any" aria-labelledby="profileDialogTitle">
    <div class="profile-dialog-inner">
      <button
        type="button"
        class="profile-dialog-close"
        id="profileCloseBtn"
        aria-label="Close profile window"
      >
        &times;
      </button>

      <h2 id="profileDialogTitle" class="profile-dialog-name">Wilson Lee</h2>

      <div class="profile-dialog-photo-frame">
        <img
          id="profileDialogPhoto"
          src="assets/images/profile/wilson-lee.jpg"
          alt="Wilson Lee"
          width="164"
          height="164"
          class="profile-dialog-photo"
        />
      </div>

      <p id="profileDialogDesc" class="profile-dialog-description">
        Current mech e at UCR BCOE. I love photography, skiing, and making small engineering projects. And food, I eat a lot of it (add me on Beli). Thanks for visiting my website!
      </p>

      <div id="profileDialogLinks" class="profile-dialog-links"></div>
    </div>
  </dialog>

  <dialog id="lightboxDialog" class="lightbox-dialog" closedby="any" aria-label="Full size image view">
    <button
      type="button"
      class="lightbox-close"
      id="lightboxCloseBtn"
      aria-label="Close image preview"
    >
      &times;
    </button>
    <img id="lightboxImg" class="lightbox-img" src="" alt="" />
  </dialog>

  <!-- Hand-drawn Unmute Hint (appears once in center of screen when video autoplays) -->
  <aside class="unmute-hint is-hidden" id="unmuteHint" aria-label="Audio hint">
    <div class="unmute-hint-card" role="button" tabindex="0">
      <svg class="unmute-hint-svg" viewBox="0 0 54 44" fill="none">
        <path
          class="hand-stroke-main"
          pathLength="1"
          d="M 6 15 L 14 15 L 23 7 L 23 37 L 14 29 L 6 29 Z"
        />
        <path
          class="hand-stroke-tip"
          pathLength="1"
          d="M 30 14 C 34 18, 34 26, 30 30 M 37 8 C 44 16, 44 28, 37 36"
        />
      </svg>
      <span class="unmute-hint-text">unmute video</span>
    </div>
  </aside>

  <!-- Bob Ross Easter Egg (bottom-right corner hot zone, no outline, circular photo with hand-drawn text) -->
  <aside class="bob-ross-zone" id="bobRossZone" aria-label="Easter egg">
    <div class="bob-ross-card">
      <img
        src="assets/images/bob-ross.jpg?v=9"
        alt="Bob Ross"
        width="92"
        height="92"
        class="bob-ross-img"
      />
      <span class="bob-ross-caption" aria-label="i like bob ross">
        <svg class="bob-ross-caption-svg" viewBox="0 0 132 24" fill="none">
          <path
            d="M 6 12 L 6 19 C 6 21, 8 21, 9 20 M 6 7 A 0.8 0.8 0 1 1 6 6.8 M 18 4 L 18 19 C 18 21, 20 21, 21 20 M 27 12 L 27 19 C 27 21, 29 21, 30 20 M 27 7 A 0.8 0.8 0 1 1 27 6.8 M 36 4 L 36 20 M 43 12 L 37 16 L 43 21 M 48 16 L 55 16 C 55 13, 52 12, 50 13 C 47 15, 47 19, 50 21 C 53 22, 55 20, 56 19 M 66 4 L 66 20 C 68 21, 71 21, 73 19 C 75 17, 75 14, 73 13 C 70 12, 67 13, 66 16 M 85 16 C 85 13, 81 12, 79 14 C 77 17, 78 20, 81 21 C 84 21, 85 18, 85 16 M 92 4 L 92 20 C 94 21, 97 21, 99 19 C 101 17, 101 14, 99 13 C 96 12, 93 13, 92 16 M 106 13 L 106 20 M 106 15 C 108 13, 110 13, 112 14 M 119 14 C 117 12, 115 13, 115 15 C 115 18, 120 17, 120 19 C 120 21, 117 21, 115 20 M 127 14 C 125 12, 123 13, 123 15 C 123 18, 128 17, 128 19 C 128 21, 125 21, 123 20"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    </div>
  </aside>

  <script type="module" src="app.js?v=9"></script>
</body>
</html>
